name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  STABLE_PYTHON_VERSION: "3.12"
  GOOGLE_API_USE_CLIENT_CERTIFICATE: "false"

jobs:
  test-linux:
    name: "Test Linux - Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/test.yaml
    with:
      coverage: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}

  test-windows:
    name: "Test Windows - Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/test.yaml
    with:
      coverage: false
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}

  test-macos:
    name: "Test macOS - Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    uses: ./.github/workflows/test.yaml
    with:
      coverage: false
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}

  build-wheel:
    name: Build pure Python wheel & sdist
    runs-on: ubuntu-latest
    needs:
      - test-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.STABLE_PYTHON_VERSION }}

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*
          if-no-files-found: error
          overwrite: true
