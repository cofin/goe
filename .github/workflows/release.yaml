name: release

on:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  STABLE_PYTHON_VERSION: "3.12"
  GOOGLE_API_USE_CLIENT_CERTIFICATE: "false"

jobs:
  pure-python-wheel-and-sdist:
    name: Build pure Python wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.STABLE_PYTHON_VERSION }}

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*
          if-no-files-found: error
          overwrite: true

  build-binaries:
    name: Build standalone PyApp binary for ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs:
      - pure-python-wheel-and-sdist
    strategy:
      fail-fast: false
      matrix:
        job:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: goe-x86_64-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: goe-aarch64-linux-gnu

    env:
      PYAPP_REPO: pyapp
      PYAPP_VERSION: v0.29.0
      PYAPP_PYTHON_VERSION: "3.13"
      PYAPP_PROJECT_NAME: "goe"
      PYAPP_FULL_ISOLATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone PyApp
        run: git clone --depth 1 --branch ${{ env.PYAPP_VERSION }} https://github.com/ofek/pyapp ${{ env.PYAPP_REPO }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ env.STABLE_PYTHON_VERSION }}

      - name: Install Zig
        if: contains(matrix.job.target, 'linux-gnu')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: contains(matrix.job.target, 'linux-gnu')
        run: uv tool install cargo-zigbuild

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: Get version
        id: version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate requirements.txt
        run: |
          uv export --no-color --frozen --no-dev --no-editable --no-hashes --no-header --no-emit-project > dist/requirements.txt
          echo "${{ github.workspace }}/dist/goe_framework-${{ steps.version.outputs.VERSION }}-py3-none-any.whl" >> dist/requirements.txt
          cat dist/requirements.txt

      - name: Bundle Python dependencies
        run: |
          uv run tools/bundle_python.py build \
            --target ${{ matrix.job.target }} \
            --requirements dist/requirements.txt \
            --output dist/python-dist-${{ matrix.job.target }}.tar.gz \
            --pyapp-dir ${{ env.PYAPP_REPO }} \
            --install-root "~/.goe"
          echo "PYAPP_DISTRIBUTION_PYTHON_PATH=python/bin/python3" >> $GITHUB_ENV

      - name: Build PyApp binary
        working-directory: ${{ env.PYAPP_REPO }}
        env:
          PYAPP_PROJECT_PATH: ${{ github.workspace }}/dist/goe_framework-${{ steps.version.outputs.VERSION }}-py3-none-any.whl
          PYAPP_PROJECT_DEPENDENCY_FILE: ""
          PYAPP_SKIP_INSTALL: "true"
        run: cargo zigbuild --release --target ${{ matrix.job.target }}.2.17

      - name: Rename binary
        run: |
          cp ${{ env.PYAPP_REPO }}/target/${{ matrix.job.target }}/release/pyapp ${{ matrix.job.artifact }}
          chmod +x ${{ matrix.job.artifact }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.job.artifact }}
          path: ${{ matrix.job.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release Assets
    needs:
      - pure-python-wheel-and-sdist
      - build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
