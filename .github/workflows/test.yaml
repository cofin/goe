name: Test
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      coverage:
        required: false
        type: boolean
        default: false
      os:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout:
        required: false
        type: number
        default: 60

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  GOOGLE_API_USE_CLIENT_CERTIFICATE: "false"

jobs:
  test:
    name: Unit Tests
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ inputs.python-version }}
        run: uv python install ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - if: ${{ inputs.coverage }}
        name: Run Ruff linting and formatting check
        run: |
          uv run ruff format --check src tests tools
          uv run ruff check src tests tools

      - if: ${{ inputs.coverage }}
        name: Run unit tests with coverage tracking
        run: uv run pytest tests/unit --cov --cov-report=xml

      - if: ${{ !inputs.coverage }}
        name: Run unit tests
        run: uv run pytest tests/unit

      - if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
