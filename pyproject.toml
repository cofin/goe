[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "goe-framework"
version = "1.1.1.dev0"
description = "Gluent Offload Engine (GOE) Framework"
readme = "README.md"
requires-python = ">=3.10"
maintainers = [
    { name = "Neil Johnson", email = "neiljohnson@google.com" },
    { name = "Cody Fincher", email = "codyfincher@google.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core packages
    "pyarrow",
    "avro",
    "configparser",
    "cryptography",
    "filelock",
    "lark-parser",
    "numpy",
    "orjson",
    "python-dateutil",
    "PyYAML",
    "requests",
    "termcolor",
    "urllib3",

    # For Cloud storage
    "fsspec[gcs]",
    "google-cloud-storage",
    "boto3",
    "azure-common",
    "azure-storage-blob",

    # For Oracle frontend
    "oracledb",

    # For BigQuery backend
    "google-cloud-bigquery",
    "google-cloud-kms",

    # Env loading
    "python-dotenv",

    # GOE Listener packages
    "fastapi==0.77.0",
    "uvicorn==0.17.6",
    "redis==4.4.4",
    "gunicorn==20.1.0",
    "brotli==1.0.9",
    "tenacity==8.0.1",
    "uvloop",
    "httptools",
]

[project.urls]
Homepage = "https://github.com/gluent/goe"
Issues = "https://github.com/gluent/goe/issues"

[project.optional-dependencies]
hadoop = [
    "hdfs",
    "impyla",
    "requests-kerberos",
    "thrift-sasl",
]
snowflake = [
    "snowflake-connector-python",
]
sql_server = [
    # For SQL Server frontend
    "pymssql",
]
synapse = [
    "pyodbc",
]
teradata = [
    "pyodbc",
]
sqlspec = [
    "sqlspec[duckdb,performance,asyncpg,mypyc,fsspec,uuid,adbc,oracledb,adk]>=0.61.0",
]
all = [
    "hdfs",
    "impyla",
    "requests-kerberos",
    "thrift-sasl",
    "snowflake-connector-python",
    "pymssql",
    "pyodbc",
    "sqlspec[duckdb,performance,asyncpg,mypyc,fsspec,uuid,adbc,oracledb,adk]>=0.61.0",
]

[dependency-groups]
dev = [
    "bump2version",
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "build" },
]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-mock",
    "filelock>=3.0.0",
]
lint = [
    "mypy>=1.13.0",
    "ruff>=0.14.0",
    "pre-commit>=3.5.0",
    "types-pyyaml",
    "types-requests",
    "types-python-dateutil",
]
docs = [
    "sphinx>=8.0.0",
    "myst-parser>=4.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]
build = [
    "bump2version",
    "build>=1.2.0",
]

[tool.uv]
managed = true
package = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["src/"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/goe"]

[tool.bumpversion]
current_version = "1.1.1.dev0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:\\.(?P<dev>dev\\d+))?"
serialize = [
    "{major}.{minor}.{patch}.{dev}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
]
fix = true
line-length = 120
src = ["src", "tests", "tools"]
target-version = "py310"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
ignore = [
    "A003",    # Class attribute shadowing a python builtin
    "ANN101",  # Missing type annotation for self in method
    "ANN102",  # Missing type annotation for cls in classmethod
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "B008",    # Do not perform function call in argument defaults
    "B010",    # Do not call setattr with a constant attribute value
    "B027",    # Allow non-abstract empty methods in abstract base classes
    "C901",    # Complexity
    "COM812",  # Missing trailing comma
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D106",    # Missing docstring in public nested class
    "D107",    # Missing docstring in __init__
    "D202",    # No blank lines allowed after function docstring
    "D205",    # 1 blank line required between summary line and description
    "D415",    # First line should end with a period, question mark, or exclamation point
    "E203",    # Whitespace before ':'
    "E501",    # Line too long, handled by formatter
    "FBT001",  # Boolean positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FBT003",  # Boolean positional value in function calls
    "FIX002",  # Line contains TODO
    "ISC001",  # Conflicts with formatter
    "PERF203", # try-except within a loop
    "PGH003",  # Use specific rule codes when ignoring type issues
    "PLC1901", # Empty string comparison
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "PLW2901", # For loop variable overwritten by assignment target
    "PT004",   # Fixture does not return anything, add leading underscore
    "PT005",   # Fixture returns a value, remove leading underscore
    "PT007",   # Wrong values type in pytest.mark.parametrize
    "RUF006",  # Store reference to asyncio task
    "RUF012",  # Mutable class attributes should be annotated with typing.ClassVar
    "S101",    # Use of assert detected
    "S105",    # Possible hardcoded password
    "S106",    # Possible hardcoded password
    "S107",    # Possible hardcoded password
    "S603",    # subprocess call: check for execution of untrusted input
    "SIM114",  # Combine if branches using logical or operator
    "SLF001",  # Private member accessed
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link on the line following this TODO
    "UP037",   # Remove quotes from type annotation
]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["goe", "tests", "tools"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**/*" = ["ANN001", "ANN201", "D103", "D104", "ERA001", "PLR2004", "S101", "S404", "T201", "TID252"]

[tool.mypy]
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
exclude = [
    "^build/",
    "^dist/",
    "^.venv/",
    "^node_modules/",
    "^bin/",
]
files = ["src/goe", "tests"]
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
warn_no_return = false
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disallow_untyped_decorators = false
module = ["tests.*"]
warn_unused_ignores = false

[tool.pyright]
exclude = ["scripts", "docs", "build", "dist", ".venv"]
include = ["src/goe", "tests", "tools"]

[tool.pytest.ini_options]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:xdist.*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
minversion = "6.0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing", "thread"]
omit = [
    "tests/*",
    "sql/*",
    "target/*",
    "tools/*",
    "templates/*",
    "bin/*",
    ".venv/*",
]
parallel = true
source = ["src/goe"]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
omit = ["*/tests/*"]
show_missing = true

