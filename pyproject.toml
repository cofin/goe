[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "goe-framework"
version = "1.1.1.dev0"
description = "Gluent Offload Engine (GOE) Framework"
readme = "README.md"
requires-python = ">=3.12"
maintainers = [
    { name = "Neil Johnson", email = "neiljohnson@google.com" },
    { name = "Cody Fincher", email = "codyfincher@google.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core packages
    "pyarrow",
    "avro",
    "configparser",
    "cryptography",
    "filelock",
    "lark-parser",
    "numpy",
    "orjson",
    "python-dateutil",
    "PyYAML",
    "requests",
    "termcolor",
    "urllib3",

    # For Cloud storage
    "fsspec[gcs]",
    "google-cloud-storage",
    "boto3",
    "azure-common",
    "azure-storage-blob",

    # For Oracle frontend
    "oracledb",

    # For BigQuery backend
    "google-cloud-bigquery",
    "google-cloud-kms",

    # Env loading
    "python-dotenv",

    # GOE Listener packages
    "fastapi==0.77.0",
    "uvicorn==0.17.6",
    "redis==4.4.4",
    "gunicorn==20.1.0",
    "brotli==1.0.9",
    "tenacity==8.0.1",
    "uvloop",
    "httptools",
]

[project.urls]
Homepage = "https://github.com/gluent/goe"
Issues = "https://github.com/gluent/goe/issues"

[project.optional-dependencies]
hadoop = [
    "hdfs",
    "impyla",
    "requests-kerberos",
    "thrift-sasl",
]
snowflake = [
    "snowflake-connector-python",
]
sql_server = [
    # For SQL Server frontend
    "pymssql",
]
synapse = [
    "pyodbc",
]
teradata = [
    "pyodbc",
]
sqlspec = [
    "sqlspec[duckdb,performance,asyncpg,mypyc,fsspec,uuid,adbc,oracledb,adk]>=0.61.0",
]
all = [
    "hdfs",
    "impyla",
    "requests-kerberos",
    "thrift-sasl",
    "snowflake-connector-python",
    "pymssql",
    "pyodbc",
    "sqlspec[duckdb,performance,asyncpg,mypyc,fsspec,uuid,adbc,oracledb,adk]>=0.61.0",
]

[dependency-groups]
dev = [
    "bump2version",
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "build" },
]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-mock",
    "filelock>=3.0.0",
]
lint = [
    "mypy>=1.13.0",
    "ruff>=0.14.0",
    "pre-commit>=3.5.0",
    "types-pyyaml",
    "types-requests",
    "types-python-dateutil",
]
docs = [
    "sphinx>=8.0.0",
    "myst-parser>=4.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]
build = [
    "bump2version",
    "build>=1.2.0",
]

[tool.uv]
managed = true
package = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["src/"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/goe"]

[tool.bumpversion]
current_version = "1.1.1.dev0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:\\.(?P<dev>dev\\d+))?"
serialize = [
    "{major}.{minor}.{patch}.{dev}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
]
fix = true
line-length = 120
src = ["src", "tests", "tools"]
target-version = "py312"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
]
ignore = [
    "E203",    # Whitespace before ':'
    "E501",    # Line too long (handled by formatter)
    "E712",    # Avoid equality comparisons to False/True
    "E721",    # Use is and is not for type comparisons
    "E722",    # Do not use bare except
    "E731",    # Do not assign a lambda expression
    "E741",    # Ambiguous variable name
    "B006",    # Do not use mutable data structures for argument defaults
    "B007",    # Loop control variable not used within loop body
    "B008",    # Do not perform function call in argument defaults
    "B010",    # Do not call setattr with a constant attribute value
    "B012",    # `break` inside `finally` blocks
    "B017",    # Do not assert blind exception
    "B018",    # Found useless expression
    "B020",    # Loop control variable overrides iterable it iterates
    "B023",    # Function definition does not bind loop variable
    "B027",    # Allow non-abstract empty methods in abstract base classes
    "B028",    # No explicit stacklevel keyword argument found
    "B034",    # re.sub should pass count and flags as keyword arguments
    "B904",    # Within an except clause, raise exceptions with raise ... from err
    "B905",    # `zip()` without an explicit `strict=` parameter
    "F401",    # Module imported but unused
    "F504",    # %-format string has unused named argument(s)
    "F507",    # %-format string placeholder mismatch
    "F811",    # Redefinition of unused name
    "F841",    # Local variable is assigned to but never used
    "UP031",   # Use format specifiers instead of percent format
    "UP035",   # Deprecated imports
    "UP037",   # Remove quotes from type annotation
    "UP042",   # Class inherits from both str and Enum
    "UP046",   # Generic class uses Generic subclass instead of type parameters
    "RUF002",  # Docstring contains ambiguous character
    "RUF003",  # Comment contains ambiguous character
    "RUF005",  # Consider iterable unpacking instead of concatenation
    "RUF006",  # Store reference to asyncio task
    "RUF012",  # Mutable class attributes should be annotated with typing.ClassVar
    "RUF013",  # PEP 484 prohibits implicit Optional
    "RUF015",  # Prefer next(...) over single element slice
    "RUF036",  # None not at the end of type union
    "RUF046",  # Value being cast to `int` is already an integer
    "RUF059",  # Unpacked variable is never used
    "ISC001",  # Conflicts with formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["goe", "tests", "tools"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**/*" = ["ANN001", "ANN201", "D103", "D104", "ERA001", "PLR2004", "S101", "S404", "T201", "TID252"]

[tool.mypy]
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
exclude = [
    "^build/",
    "^dist/",
    "^.venv/",
    "^node_modules/",
    "^bin/",
]
files = ["src/goe", "tests"]
follow_imports = "silent"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
warn_no_return = false
warn_redundant_casts = false
warn_unused_configs = false
warn_unused_ignores = false
disable_error_code = [
    "attr-defined",
    "assignment",
    "arg-type",
    "has-type",
    "union-attr",
    "misc",
    "call-arg",
    "call-overload",
    "override",
    "index",
    "return-value",
    "var-annotated",
    "operator",
    "name-defined",
]

[[tool.mypy.overrides]]
module = [
    "goe.listener.*",
    "goe.connect.*",
    "goe.schema_sync.*",
    "tests.*",
]
ignore_errors = true
warn_unused_ignores = false

[tool.pyright]
exclude = ["scripts", "docs", "build", "dist", ".venv"]
include = ["src/goe", "tests", "tools"]

[tool.pytest.ini_options]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:xdist.*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
minversion = "6.0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing", "thread"]
omit = [
    "tests/*",
    "sql/*",
    "target/*",
    "tools/*",
    "templates/*",
    "bin/*",
    ".venv/*",
]
parallel = true
source = ["src/goe"]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
omit = ["*/tests/*"]
show_missing = true

